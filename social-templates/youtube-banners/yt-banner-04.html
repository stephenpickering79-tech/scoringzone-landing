<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=2560">
<title>YT Banner 04 — Diagonal Energy</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2560px;height:1440px;overflow:hidden;font-family:'DM Sans',sans-serif;background:#050505;position:relative}

/* Full bleed scenic photo */
.bg{position:absolute;inset:0}
.bg img{width:100%;height:100%;object-fit:cover;filter:brightness(0.45)}

/* Diagonal dark overlay — upper portion */
.diag-overlay{position:absolute;inset:0;background:linear-gradient(155deg,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.85) 40%,transparent 41%);z-index:2}

/* Bold diagonal green line */
.diag-line{position:absolute;top:0;left:0;width:200%;height:4px;background:linear-gradient(to right,#22c55e,rgba(34,197,94,0.3) 60%,transparent);transform-origin:top left;transform:rotate(33deg);z-index:3}

/* Energy lines — thinner, offset */
.energy-1{position:absolute;top:0;left:0;width:200%;height:2px;background:linear-gradient(to right,rgba(34,197,94,0.2),transparent 50%);transform-origin:top left;transform:rotate(33deg) translateY(40px);z-index:3}
.energy-2{position:absolute;top:0;left:0;width:200%;height:2px;background:linear-gradient(to right,rgba(34,197,94,0.15),transparent 40%);transform-origin:top left;transform:rotate(33deg) translateY(80px);z-index:3}

/* Target ring — upper left in dark zone */
.target-ring{position:absolute;top:10%;left:5%;width:400px;height:400px;z-index:4}
.target-ring svg{width:100%;height:100%}

/* Brand content — left aligned in dark zone */
.safe-zone{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1546px;height:423px;display:flex;align-items:center;z-index:10}

.brand-left{padding-left:20px}
.brand-logo{width:70px;height:70px;margin-bottom:16px}
.brand-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:88px;color:#fff;text-transform:uppercase;letter-spacing:0.04em;line-height:0.9}
.brand-name em{font-style:normal;color:#22c55e}
.brand-tagline{font-family:'DM Sans',sans-serif;font-size:22px;color:rgba(255,255,255,0.5);font-weight:500;letter-spacing:0.08em;text-transform:uppercase;margin-top:14px}

/* Stat pills — bottom of dark zone */
.stat-row{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1546px;margin-top:170px;padding-left:20px;display:flex;gap:24px;z-index:10}
.stat-pill{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.7);border:1px solid rgba(34,197,94,0.25);border-radius:8px;padding:10px 20px}
.stat-pill .dot{width:8px;height:8px;background:#22c55e;border-radius:50%}
.stat-pill span{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:rgba(255,255,255,0.7);letter-spacing:0.06em;text-transform:uppercase}

.accent-top{position:absolute;top:0;left:0;right:0;height:4px;background:#22c55e;z-index:10}
</style></head>
<body>

<div class="bg"><img src="../../golf images/scenic golf hole.png" alt=""></div>
<div class="diag-overlay"></div>
<div class="diag-line"></div>
<div class="energy-1"></div>
<div class="energy-2"></div>

<div class="target-ring">
  <svg viewBox="0 0 400 400" fill="none"><circle cx="200" cy="200" r="175" stroke="#22c55e" stroke-width="12" opacity="0.12"/><circle cx="200" cy="200" r="115" stroke="#22c55e" stroke-width="8" opacity="0.09"/><circle cx="200" cy="200" r="55" stroke="#22c55e" stroke-width="5" opacity="0.07"/><circle cx="200" cy="200" r="12" fill="#22c55e" opacity="0.1"/></svg>
</div>

<div class="safe-zone">
  <div class="brand-left">
    <svg class="brand-logo" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="42" stroke="#22c55e" stroke-width="6"/><circle cx="50" cy="50" r="27" stroke="#22c55e" stroke-width="4"/><circle cx="50" cy="50" r="12" stroke="#22c55e" stroke-width="3"/><circle cx="50" cy="50" r="4" fill="#22c55e"/></svg>
    <div class="brand-name">Scoring<br><em>Zone</em></div>
    <div class="brand-tagline">Pressure Test Your Short Game</div>
  </div>
</div>

<div class="stat-row">
  <div class="stat-pill"><div class="dot"></div><span>Chipping</span></div>
  <div class="stat-pill"><div class="dot"></div><span>Putting</span></div>
  <div class="stat-pill"><div class="dot"></div><span>Bunker</span></div>
  <div class="stat-pill"><div class="dot"></div><span>Pitching</span></div>
</div>

<div class="accent-top"></div>

</body></html>

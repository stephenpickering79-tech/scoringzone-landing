<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=2560">
<title>YT Banner 03 — Triple Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2560px;height:1440px;overflow:hidden;font-family:'DM Sans',sans-serif;background:#050505;position:relative}

/* Three photo panels */
.panel{position:absolute;top:80px;bottom:80px;overflow:hidden}
.panel img{width:100%;height:100%;object-fit:cover;filter:brightness(0.6) saturate(0.9)}
.panel::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.3),transparent 30%,transparent 70%,rgba(0,0,0,0.3))}

.panel-1{left:0;width:30%}
.panel-2{left:32%;width:36%}
.panel-3{right:0;width:30%}

/* Green divider lines between panels */
.divider-1{position:absolute;top:80px;left:30.5%;width:3px;bottom:80px;background:linear-gradient(to bottom,transparent,#22c55e 15%,#22c55e 85%,transparent);z-index:5}
.divider-2{position:absolute;top:80px;left:69.5%;width:3px;bottom:80px;background:linear-gradient(to bottom,transparent,#22c55e 15%,#22c55e 85%,transparent);z-index:5}

/* Top & bottom bars */
.bar{position:absolute;left:0;right:0;height:80px;background:#000;z-index:10}
.bar-top{top:0}
.bar-bottom{bottom:0}
.bar-top::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(to right,transparent,#22c55e 15%,#22c55e 85%,transparent)}
.bar-bottom::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(to right,transparent,#22c55e 15%,#22c55e 85%,transparent)}

/* Center brand overlay */
.safe-zone{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1546px;height:423px;display:flex;align-items:center;justify-content:center;z-index:20}

.brand-center{text-align:center;background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);padding:48px 80px;border-radius:16px;border:1px solid rgba(34,197,94,0.2)}
.brand-logo{width:70px;height:70px;margin:0 auto 16px}
.brand-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:80px;color:#fff;text-transform:uppercase;letter-spacing:0.04em;line-height:0.9}
.brand-name em{font-style:normal;color:#22c55e}
.brand-tagline{font-family:'DM Sans',sans-serif;font-size:20px;color:rgba(255,255,255,0.5);font-weight:500;letter-spacing:0.1em;text-transform:uppercase;margin-top:12px}
.brand-url{font-family:'JetBrains Mono',monospace;font-size:16px;color:#22c55e;font-weight:600;letter-spacing:0.06em;margin-top:14px}

/* Category labels on panels */
.panel-label{position:absolute;bottom:110px;z-index:15;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#22c55e;display:flex;align-items:center;gap:8px}
.panel-label::before{content:'';width:6px;height:6px;background:#22c55e;border-radius:50%}
.label-1{left:5%}
.label-2{left:42%}
.label-3{right:5%}
</style></head>
<body>

<div class="panel panel-1"><img src="../../Images for n8n/Chipping-image-1.png" alt=""></div>
<div class="panel panel-2"><img src="../../Images for n8n/Putting-image-1.png" alt=""></div>
<div class="panel panel-3"><img src="../../Images for n8n/CTA-image-1.png" alt=""></div>

<div class="divider-1"></div>
<div class="divider-2"></div>

<div class="bar bar-top"></div>
<div class="bar bar-bottom"></div>


<div class="safe-zone">
  <div class="brand-center">
    <svg class="brand-logo" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="42" stroke="#22c55e" stroke-width="6"/><circle cx="50" cy="50" r="27" stroke="#22c55e" stroke-width="4"/><circle cx="50" cy="50" r="12" stroke="#22c55e" stroke-width="3"/><circle cx="50" cy="50" r="4" fill="#22c55e"/></svg>
    <div class="brand-name">Scoring <em>Zone</em></div>
    <div class="brand-tagline">Pressure Test Your Short Game</div>
    <div class="brand-url">scoringzone.net</div>
  </div>
</div>

</body></html>

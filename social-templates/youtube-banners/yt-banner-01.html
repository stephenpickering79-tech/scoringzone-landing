<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=2560">
<title>YT Banner 01 — Cinematic Split</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2560px;height:1440px;overflow:hidden;font-family:'DM Sans',sans-serif;background:#000;position:relative}

/* Full-bleed photo — left side */
.photo-left{position:absolute;top:0;left:0;width:55%;height:100%;overflow:hidden}
.photo-left img{width:100%;height:100%;object-fit:cover;filter:brightness(0.7)}
.photo-left::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,transparent 50%,#000 100%)}

/* Dark right panel */
.right-panel{position:absolute;top:0;right:0;width:50%;height:100%;background:#000}

/* Green accent stripe at the split */
.split-line{position:absolute;top:0;left:53%;width:4px;height:100%;background:linear-gradient(to bottom,transparent,#22c55e 20%,#22c55e 80%,transparent);z-index:5}

/* Target ring — right side, large, subtle */
.target-ring{position:absolute;top:50%;right:5%;transform:translateY(-50%);width:600px;height:600px;z-index:2}
.target-ring svg{width:100%;height:100%}

/* Center content — safe zone */
.safe-zone{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1546px;height:423px;display:flex;align-items:center;justify-content:flex-end;z-index:10;padding-right:40px}

.brand-block{text-align:right}
.brand-logo{width:80px;height:80px;margin-bottom:16px;margin-left:auto;display:block}
.brand-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:72px;color:#fff;text-transform:uppercase;letter-spacing:0.04em;line-height:0.9}
.brand-name em{font-style:normal;color:#22c55e}
.brand-tagline{font-family:'DM Sans',sans-serif;font-size:22px;color:rgba(255,255,255,0.5);font-weight:500;letter-spacing:0.08em;text-transform:uppercase;margin-top:12px}
.brand-url{font-family:'JetBrains Mono',monospace;font-size:18px;color:#22c55e;font-weight:600;letter-spacing:0.06em;margin-top:16px}

/* Top/bottom green accent lines */
.accent-top{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(to right,transparent,#22c55e 20%,#22c55e 80%,transparent);z-index:10}
.accent-bottom{position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(to right,transparent,#22c55e 20%,#22c55e 80%,transparent);z-index:10}
</style></head>
<body>

<div class="photo-left"><img src="../../golf images/scenic golf course image.png" alt=""></div>
<div class="right-panel"></div>
<div class="split-line"></div>

<div class="target-ring">
  <svg viewBox="0 0 600 600" fill="none"><circle cx="300" cy="300" r="270" stroke="#22c55e" stroke-width="16" opacity="0.08"/><circle cx="300" cy="300" r="180" stroke="#22c55e" stroke-width="10" opacity="0.06"/><circle cx="300" cy="300" r="90" stroke="#22c55e" stroke-width="7" opacity="0.05"/><circle cx="300" cy="300" r="20" fill="#22c55e" opacity="0.08"/></svg>
</div>

<div class="safe-zone">
  <div class="brand-block">
    <svg class="brand-logo" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="42" stroke="#22c55e" stroke-width="6"/><circle cx="50" cy="50" r="27" stroke="#22c55e" stroke-width="4"/><circle cx="50" cy="50" r="12" stroke="#22c55e" stroke-width="3"/><circle cx="50" cy="50" r="4" fill="#22c55e"/></svg>
    <div class="brand-name">Scoring<br><em>Zone</em></div>
    <div class="brand-tagline">Pressure Test Your Short Game</div>
    <div class="brand-url">scoringzone.net</div>
  </div>
</div>

<div class="accent-top"></div>
<div class="accent-bottom"></div>

</body></html>

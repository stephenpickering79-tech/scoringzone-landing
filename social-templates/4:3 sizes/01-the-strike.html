<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoring Zone — The Strike</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #111;
    font-family: 'DM Sans', sans-serif;
  }

  .template {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #000;
  }

  /* ── Background image ── */
  .bg-image {
    position: absolute;
    inset: 0;
    background: url('../Images for n8n/CTA-image-1.png') center/cover no-repeat;
    filter: brightness(0.85);
    transform: scale(1.06);
    animation: kenBurns 6s ease-out forwards;
  }

  @keyframes kenBurns {
    to { transform: scale(1); }
  }

  /* ── Bold green side panel — LEFT 15% ── */
  .side-panel {
    position: absolute;
    top: 0;
    left: 0;
    width: 15%;
    height: 100%;
    background: linear-gradient(135deg, rgba(34,197,94,0.22) 0%, rgba(34,197,94,0.10) 100%);
    border-right: 3px solid rgba(34,197,94,0.4);
    z-index: 4;
    transform: translateX(-110%);
    animation: panelSlideIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s forwards;
  }

  @keyframes panelSlideIn {
    to { transform: translateX(0); }
  }

  /* Measurement ticks on the panel edge */
  .side-panel::before {
    content: '';
    position: absolute;
    top: 30%;
    right: -16px;
    width: 16px;
    height: 2px;
    background: rgba(34,197,94,0.5);
  }

  .side-panel::after {
    content: '';
    position: absolute;
    top: 60%;
    right: -10px;
    width: 10px;
    height: 2px;
    background: rgba(34,197,94,0.35);
  }

  /* ── Thick target ring — bottom right, cropped ── */
  .target-ring {
    position: absolute;
    bottom: -120px;
    right: -120px;
    width: 500px;
    height: 500px;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.9);
    animation: ringReveal 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.0s forwards;
  }

  @keyframes ringReveal {
    to { opacity: 1; transform: scale(1); }
  }

  .target-ring svg {
    width: 100%;
    height: 100%;
  }

  /* ── Horizontal precision line ── */
  .precision-line {
    position: absolute;
    top: 45%;
    left: 15%;
    width: 85%;
    height: 2px;
    background: linear-gradient(to right, rgba(34,197,94,0.5), rgba(34,197,94,0.2) 60%, transparent);
    z-index: 5;
    transform: scaleX(0);
    transform-origin: left;
    animation: lineSweep 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.3s forwards;
  }

  @keyframes lineSweep {
    to { transform: scaleX(1); }
  }

  /* ── Top banner — refined with gradient + logo mark ── */
  .top-banner {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    transform: translateY(-100%);
    animation: slideDown 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.2s forwards;
  }

  .top-banner .logo-mark {
    width: 28px;
    height: 28px;
    opacity: 0.7;
  }

  .top-banner span {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #000;
    text-transform: uppercase;
  }

  @keyframes slideDown {
    to { transform: translateY(0); }
  }

  /* ── Bottom banner — bolder with green accent line + logo ── */
  .bottom-banner {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 10;
    transform: translateY(100%);
    animation: slideUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.8s forwards;
  }

  .bottom-banner::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, #22c55e 20%, #22c55e 80%, transparent);
  }

  .bottom-banner .logo-mark-sm {
    width: 18px;
    height: 18px;
    opacity: 0.6;
  }

  .bottom-banner span {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: #22c55e;
    text-transform: lowercase;
  }

  @keyframes slideUp {
    to { transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="template">
  <div class="bg-image"></div>

  <!-- Bold green side panel -->
  <div class="side-panel"></div>

  <!-- Thick target ring — bottom right -->
  <div class="target-ring">
    <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="250" cy="250" r="220" stroke="#22c55e" stroke-width="18" opacity="0.2"/>
      <circle cx="250" cy="250" r="145" stroke="#22c55e" stroke-width="12" opacity="0.16"/>
      <circle cx="250" cy="250" r="75" stroke="#22c55e" stroke-width="8" opacity="0.12"/>
      <circle cx="250" cy="250" r="18" fill="#22c55e" opacity="0.2"/>
    </svg>
  </div>

  <!-- Precision line -->
  <div class="precision-line"></div>

  <!-- Top banner -->
  <div class="top-banner">
    <svg class="logo-mark" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="42" stroke="#000" stroke-width="7"/>
      <circle cx="50" cy="50" r="27" stroke="#000" stroke-width="5"/>
      <circle cx="50" cy="50" r="12" stroke="#000" stroke-width="4"/>
      <circle cx="50" cy="50" r="4" fill="#000"/>
    </svg>
    <span>Scoring Zone</span>
  </div>

  <!-- Bottom banner -->
  <div class="bottom-banner">
    <svg class="logo-mark-sm" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="42" stroke="#22c55e" stroke-width="7"/>
      <circle cx="50" cy="50" r="27" stroke="#22c55e" stroke-width="5"/>
      <circle cx="50" cy="50" r="4" fill="#22c55e"/>
    </svg>
    <span>scoringzone.net</span>
  </div>
</div>

</body>
</html>

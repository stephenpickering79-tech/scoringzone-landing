<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoring Zone — The Scorecard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #111;
    font-family: 'DM Sans', sans-serif;
  }

  .template {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #000;
  }

  /* ── Background image ── */
  .bg-image {
    position: absolute;
    inset: 0;
    background: url('../Images for n8n/Chipping-image-1.png') center/cover no-repeat;
    filter: brightness(0.88);
    transform: scale(1.04);
    animation: kenBurns 6s ease-out forwards;
  }

  @keyframes kenBurns {
    to { transform: scale(1); }
  }

  /* ── BOLD GREEN INSET FRAME ── */
  .inset-frame {
    position: absolute;
    top: 90px;
    left: 48px;
    right: 48px;
    bottom: 82px;
    border: 4px solid rgba(34,197,94,0.35);
    z-index: 4;
    opacity: 0;
    transform: scale(0.95);
    animation: frameScale 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.7s forwards;
  }

  @keyframes frameScale {
    to { opacity: 1; transform: scale(1); }
  }

  /* Corner accents — thicker, visible */
  .inset-frame::before {
    content: '';
    position: absolute;
    top: -4px;
    left: -4px;
    width: 50px;
    height: 50px;
    border-top: 4px solid #22c55e;
    border-left: 4px solid #22c55e;
  }

  .inset-frame::after {
    content: '';
    position: absolute;
    bottom: -4px;
    right: -4px;
    width: 50px;
    height: 50px;
    border-bottom: 4px solid #22c55e;
    border-right: 4px solid #22c55e;
  }

  /* Additional corners */
  .corner-tr, .corner-bl {
    position: absolute;
    width: 50px;
    height: 50px;
    z-index: 5;
    opacity: 0;
    animation: cornerReveal 0.3s ease 1.1s forwards;
  }

  .corner-tr {
    top: 86px;
    right: 44px;
    border-top: 4px solid #22c55e;
    border-right: 4px solid #22c55e;
  }

  .corner-bl {
    bottom: 78px;
    left: 44px;
    border-bottom: 4px solid #22c55e;
    border-left: 4px solid #22c55e;
  }

  @keyframes cornerReveal {
    to { opacity: 1; }
  }

  /* ── Large centered target logo mark ── */
  .center-logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    width: 440px;
    height: 440px;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    animation: logoReveal 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.0s forwards;
  }

  @keyframes logoReveal {
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .center-logo svg {
    width: 100%;
    height: 100%;
  }

  /* ── Top banner ── */
  .top-banner {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    transform: translateY(-100%);
    animation: slideDown 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.2s forwards;
  }

  .top-banner .logo-mark {
    width: 28px;
    height: 28px;
    opacity: 0.7;
  }

  .top-banner span {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #000;
    text-transform: uppercase;
  }

  @keyframes slideDown {
    to { transform: translateY(0); }
  }

  /* ── Bottom banner ── */
  .bottom-banner {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 10;
    transform: translateY(100%);
    animation: slideUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.6s forwards;
  }

  .bottom-banner::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, #22c55e 20%, #22c55e 80%, transparent);
  }

  .bottom-banner .logo-mark-sm {
    width: 18px;
    height: 18px;
    opacity: 0.6;
  }

  .bottom-banner span {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: #22c55e;
    text-transform: lowercase;
  }

  @keyframes slideUp {
    to { transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="template">
  <div class="bg-image"></div>

  <!-- Bold green inset frame -->
  <div class="inset-frame"></div>
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>


  <!-- Top banner -->
  <div class="top-banner">
    <svg class="logo-mark" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="42" stroke="#000" stroke-width="7"/>
      <circle cx="50" cy="50" r="27" stroke="#000" stroke-width="5"/>
      <circle cx="50" cy="50" r="12" stroke="#000" stroke-width="4"/>
      <circle cx="50" cy="50" r="4" fill="#000"/>
    </svg>
    <span>Scoring Zone</span>
  </div>

  <!-- Bottom banner -->
  <div class="bottom-banner">
    <svg class="logo-mark-sm" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="42" stroke="#22c55e" stroke-width="7"/>
      <circle cx="50" cy="50" r="27" stroke="#22c55e" stroke-width="5"/>
      <circle cx="50" cy="50" r="4" fill="#22c55e"/>
    </svg>
    <span>scoringzone.net</span>
  </div>
</div>

</body>
</html>

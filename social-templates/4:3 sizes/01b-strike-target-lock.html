<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoring Zone — Strike: Target Lock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #111;
    font-family: 'DM Sans', sans-serif;
  }

  .template {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #000;
  }

  /* ── Background image ── */
  .bg-image {
    position: absolute;
    inset: 0;
    background: url('../Images for n8n/CTA-image-1.png') center/cover no-repeat;
    filter: brightness(0.82);
    transform: scale(1.08);
    animation: kenBurns 5s ease-out forwards;
  }

  @keyframes kenBurns {
    to { transform: scale(1); }
  }

  /* Radial vignette pulling focus to center */
  .bg-image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 25%, rgba(0,0,0,0.4) 70%);
  }

  /* ── TARGET SYSTEM — thick rings matching logo DNA ── */
  .target-system {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 650px;
    height: 650px;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    animation: systemFade 0.3s ease 0.6s forwards;
  }

  @keyframes systemFade {
    to { opacity: 1; }
  }

  .target-system svg {
    width: 100%;
    height: 100%;
  }

  /* Outer ring contracts in */
  .ring-outer {
    transform-origin: center;
    transform: scale(1.4);
    opacity: 0;
    animation: ringIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
  }

  .ring-mid {
    transform-origin: center;
    transform: scale(1.4);
    opacity: 0;
    animation: ringIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
  }

  .ring-inner {
    transform-origin: center;
    transform: scale(1.4);
    opacity: 0;
    animation: ringIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
  }

  .ring-dot {
    transform-origin: center;
    opacity: 0;
    animation: dotPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
  }

  @keyframes ringIn {
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes dotPop {
    0% { opacity: 0; transform: scale(0); }
    60% { transform: scale(1.5); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ── CROSSHAIRS — bold, 3px ── */
  .cross-h {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 3px;
    z-index: 5;
    transform: translateY(-50%);
    overflow: hidden;
  }

  .cross-h-left {
    position: absolute;
    left: 0;
    top: 0;
    width: 38%;
    height: 100%;
    background: linear-gradient(to right, transparent, rgba(34,197,94,0.5));
    transform: translateX(-110%);
    animation: slideRight 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.3s forwards;
  }

  .cross-h-right {
    position: absolute;
    right: 0;
    top: 0;
    width: 38%;
    height: 100%;
    background: linear-gradient(to left, transparent, rgba(34,197,94,0.5));
    transform: translateX(110%);
    animation: slideLeft 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.3s forwards;
  }

  @keyframes slideRight { to { transform: translateX(0); } }
  @keyframes slideLeft { to { transform: translateX(0); } }

  .cross-v {
    position: absolute;
    left: 50%;
    top: 0;
    width: 3px;
    height: 100%;
    z-index: 5;
    transform: translateX(-50%);
    overflow: hidden;
  }

  .cross-v-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 38%;
    background: linear-gradient(to bottom, transparent, rgba(34,197,94,0.5));
    transform: translateY(-110%);
    animation: slideDown2 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.3s forwards;
  }

  .cross-v-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 38%;
    background: linear-gradient(to top, transparent, rgba(34,197,94,0.5));
    transform: translateY(110%);
    animation: slideUp2 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.3s forwards;
  }

  @keyframes slideDown2 { to { transform: translateY(0); } }
  @keyframes slideUp2 { to { transform: translateY(0); } }

  /* ── Corner brackets — thick, bold ── */
  .corner {
    position: absolute;
    width: 56px;
    height: 56px;
    z-index: 6;
    opacity: 0;
    animation: cornerPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
  }

  .corner--tl { top: 80px; left: 60px; border-top: 4px solid rgba(34,197,94,0.6); border-left: 4px solid rgba(34,197,94,0.6); }
  .corner--tr { top: 80px; right: 60px; border-top: 4px solid rgba(34,197,94,0.6); border-right: 4px solid rgba(34,197,94,0.6); }
  .corner--bl { bottom: 72px; left: 60px; border-bottom: 4px solid rgba(34,197,94,0.6); border-left: 4px solid rgba(34,197,94,0.6); }
  .corner--br { bottom: 72px; right: 60px; border-bottom: 4px solid rgba(34,197,94,0.6); border-right: 4px solid rgba(34,197,94,0.6); }

  @keyframes cornerPop {
    0% { opacity: 0; transform: scale(0.7); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ── Top banner ── */
  .top-banner {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    transform: translateY(-100%);
    animation: slideDown 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.15s forwards;
  }

  .top-banner .logo-mark { width: 28px; height: 28px; opacity: 0.7; }

  .top-banner span {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #000;
    text-transform: uppercase;
  }

  @keyframes slideDown {
    to { transform: translateY(0); }
  }

  /* ── Bottom banner ── */
  .bottom-banner {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 10;
    transform: translateY(100%);
    animation: slideUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.8s forwards;
  }

  .bottom-banner::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, #22c55e 20%, #22c55e 80%, transparent);
  }

  .bottom-banner .logo-mark-sm { width: 18px; height: 18px; opacity: 0.6; }

  .bottom-banner span {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: #22c55e;
    text-transform: lowercase;
  }

  @keyframes slideUp {
    to { transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="template">
  <div class="bg-image"></div>

  <!-- Target ring system — thick, matching logo proportions -->
  <div class="target-system">
    <svg viewBox="0 0 650 650" fill="none">
      <circle class="ring-outer" cx="325" cy="325" r="290" stroke="#22c55e" stroke-width="22" opacity="0.3"/>
      <circle class="ring-mid" cx="325" cy="325" r="190" stroke="#22c55e" stroke-width="16" opacity="0.25"/>
      <circle class="ring-inner" cx="325" cy="325" r="90" stroke="#22c55e" stroke-width="10" opacity="0.2"/>
      <circle class="ring-dot" cx="325" cy="325" r="14" fill="#22c55e" opacity="0.6"/>
    </svg>
  </div>

  <!-- Crosshairs -->
  <div class="cross-h">
    <div class="cross-h-left"></div>
    <div class="cross-h-right"></div>
  </div>
  <div class="cross-v">
    <div class="cross-v-top"></div>
    <div class="cross-v-bottom"></div>
  </div>

  <!-- Corner brackets -->
  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <!-- Banners -->
  <div class="top-banner">
    <svg class="logo-mark" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="42" stroke="#000" stroke-width="7"/>
      <circle cx="50" cy="50" r="27" stroke="#000" stroke-width="5"/>
      <circle cx="50" cy="50" r="12" stroke="#000" stroke-width="4"/>
      <circle cx="50" cy="50" r="4" fill="#000"/>
    </svg>
    <span>Scoring Zone</span>
  </div>
  <div class="bottom-banner">
    <svg class="logo-mark-sm" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="42" stroke="#22c55e" stroke-width="7"/>
      <circle cx="50" cy="50" r="27" stroke="#22c55e" stroke-width="5"/>
      <circle cx="50" cy="50" r="4" fill="#22c55e"/>
    </svg>
    <span>scoringzone.net</span>
  </div>
</div>

</body>
</html>

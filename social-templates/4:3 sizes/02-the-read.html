<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoring Zone — The Read</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #111;
    font-family: 'DM Sans', sans-serif;
  }

  .template {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #000;
  }

  /* ── Background image ── */
  .bg-image {
    position: absolute;
    inset: 0;
    background: url('../Images for n8n/Putting-image-1.png') center/cover no-repeat;
    filter: brightness(0.88);
    transform: scale(1);
    animation: kenBurnsSlow 7s ease-out forwards;
  }

  @keyframes kenBurnsSlow {
    to { transform: scale(1.04); }
  }

  /* ── DIAGONAL SPLIT — dark upper-left triangle ── */
  .diagonal-overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    /* Diagonal from top-left to ~65% across bottom */
    background: linear-gradient(
      to bottom right,
      rgba(0,0,0,0.7) 0%,
      rgba(0,0,0,0.7) 42%,
      transparent 42.5%
    );
    opacity: 0;
    animation: diagFade 0.6s ease 0.5s forwards;
  }

  @keyframes diagFade {
    to { opacity: 1; }
  }

  /* ── Bold diagonal green line — the split edge ── */
  .diag-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 150%;
    height: 4px;
    background: linear-gradient(to right, #22c55e 0%, rgba(34,197,94,0.4) 70%, transparent 100%);
    transform-origin: top left;
    transform: rotate(42.5deg) translateY(-2px);
    z-index: 4;
    opacity: 0;
    animation: diagLineReveal 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.9s forwards;
  }

  @keyframes diagLineReveal {
    0% { opacity: 0; clip-path: inset(0 100% 0 0); }
    100% { opacity: 1; clip-path: inset(0 0 0 0); }
  }

  /* ── Target ring — upper left area, partial crop ── */
  .target-ring {
    position: absolute;
    top: -80px;
    left: -80px;
    width: 420px;
    height: 420px;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    animation: ringFadeIn 0.5s ease 1.2s forwards;
  }

  @keyframes ringFadeIn {
    to { opacity: 1; }
  }

  .target-ring svg {
    width: 100%;
    height: 100%;
  }

  /* ── Vertical tick marks on the dark side ── */
  .tick-system {
    position: absolute;
    top: 56px;
    left: 40px;
    width: 2px;
    height: 300px;
    z-index: 6;
    opacity: 0;
    animation: tickFade 0.4s ease 1.4s forwards;
  }

  @keyframes tickFade {
    to { opacity: 1; }
  }

  .tick-system::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(34,197,94,0.5), rgba(34,197,94,0.1));
  }

  .tick {
    position: absolute;
    left: 0;
    height: 2px;
    background: rgba(34,197,94,0.4);
  }

  .tick--1 { top: 25%; width: 18px; }
  .tick--2 { top: 50%; width: 12px; }
  .tick--3 { top: 75%; width: 18px; }

  /* ── Top banner ── */
  .top-banner {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    transform: translateY(-100%);
    animation: slideDown 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.2s forwards;
  }

  .top-banner .logo-mark {
    width: 28px;
    height: 28px;
    opacity: 0.7;
  }

  .top-banner span {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #000;
    text-transform: uppercase;
  }

  @keyframes slideDown {
    to { transform: translateY(0); }
  }

  /* ── Bottom banner ── */
  .bottom-banner {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 10;
    transform: translateY(100%);
    animation: slideUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.8s forwards;
  }

  .bottom-banner::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, #22c55e 20%, #22c55e 80%, transparent);
  }

  .bottom-banner .logo-mark-sm {
    width: 18px;
    height: 18px;
    opacity: 0.6;
  }

  .bottom-banner span {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: #22c55e;
    text-transform: lowercase;
  }

  @keyframes slideUp {
    to { transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="template">
  <div class="bg-image"></div>

  <!-- Diagonal dark overlay -->
  <div class="diagonal-overlay"></div>

  <!-- Bold diagonal green line -->
  <div class="diag-line"></div>

  <!-- Target ring — upper left -->
  <div class="target-ring">
    <svg viewBox="0 0 420 420" fill="none">
      <circle cx="210" cy="210" r="185" stroke="#22c55e" stroke-width="16" opacity="0.18"/>
      <circle cx="210" cy="210" r="120" stroke="#22c55e" stroke-width="10" opacity="0.14"/>
      <circle cx="210" cy="210" r="55" stroke="#22c55e" stroke-width="7" opacity="0.10"/>
      <circle cx="210" cy="210" r="14" fill="#22c55e" opacity="0.15"/>
    </svg>
  </div>

  <!-- Vertical measurement ticks -->
  <div class="tick-system">
    <div class="tick tick--1"></div>
    <div class="tick tick--2"></div>
    <div class="tick tick--3"></div>
  </div>

  <!-- Top banner -->
  <div class="top-banner">
    <svg class="logo-mark" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="42" stroke="#000" stroke-width="7"/>
      <circle cx="50" cy="50" r="27" stroke="#000" stroke-width="5"/>
      <circle cx="50" cy="50" r="12" stroke="#000" stroke-width="4"/>
      <circle cx="50" cy="50" r="4" fill="#000"/>
    </svg>
    <span>Scoring Zone</span>
  </div>

  <!-- Bottom banner -->
  <div class="bottom-banner">
    <svg class="logo-mark-sm" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="42" stroke="#22c55e" stroke-width="7"/>
      <circle cx="50" cy="50" r="27" stroke="#22c55e" stroke-width="5"/>
      <circle cx="50" cy="50" r="4" fill="#22c55e"/>
    </svg>
    <span>scoringzone.net</span>
  </div>
</div>

</body>
</html>
